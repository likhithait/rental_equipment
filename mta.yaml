_schema-version: 3.3.0
ID: sprint
version: 1.0.0
description: "RETS - Rental Equipment Tracking System - SAP CAP Node.js"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npm run build:apps # copy Fiori apps + launchpad next to the CAP server
modules:
  - name: sprint-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M # fits the BTP free tier / trial quota
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: RETS
      - name: sprint-auth

  - name: sprint-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: RETS
  - name: sprint
    type: approuter.nodejs
    path: .deploy/app-router
    build-parameters:
      ignore: ["node_modules/", "default-env.json"]
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sprint-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: RETS
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared # free tier: needs a SAP HANA Cloud instance (plan hana-free)
  - name: sprint-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sprint-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'RETS_Admin (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'RETS_Manager (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Manager'
          - name: 'RETS_Dispatcher (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Dispatcher'
          - name: 'RETS_YardWorker (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.YardWorker'
          - name: 'RETS_Technician (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Technician'
          - name: 'RETS_BillingClerk (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.BillingClerk'
          - name: 'RETS_Auditor (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Auditor'
    requires:
      - name: app-api
